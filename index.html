<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Precision Calculator</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --display-bg: #0d121f;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --btn-num: #1e293b;
            --btn-num-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #243048;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .mode-badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .display-card {
            background: var(--display-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .expression-line {
            color: var(--text-secondary);
            font-size: 0.95rem;
            min-height: 24px;
            text-align: right;
            word-break: break-all;
        }

        .main-display {
            color: var(--text-primary);
            font-size: 2.5rem;
            font-weight: 700;
            text-align: right;
            min-height: 56px;
            word-break: break-all;
            margin: 8px 0;
        }

        /* Breakdown Steps Panel */
        .breakdown-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            border-left: 3px solid var(--accent-green);
            font-size: 0.85rem;
            display: none;
        }

        .breakdown-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .breakdown-row:last-child {
            margin-bottom: 0;
        }

        .label { color: var(--text-secondary); }
        .val { font-weight: 600; color: var(--text-primary); }
        .val-highlight { font-weight: 700; color: var(--accent-green); }

        /* Keypad Grid */
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            border: none;
            outline: none;
            padding: 16px 0;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-primary);
            background-color: var(--btn-num);
            transition: all 0.12s ease;
        }

        button:hover {
            background-color: var(--btn-num-hover);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-clear { background: #ef4444; color: #fff; }
        .btn-clear:hover { background: #dc2626; }

        .btn-op { background: var(--accent-blue); color: #fff; }
        .btn-op:hover { background: #2563eb; }

        .btn-rev {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            grid-column: span 2;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-rev:hover { opacity: 0.95; }

        /* History drawer */
        .history-section {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .history-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<div class="calculator-container">
    <div class="header">
        <h1>Precision Calculator</h1>
        <span class="mode-badge">Exact Reversion Active</span>
    </div>

    <div class="display-card">
        <div class="expression-line" id="expression">0</div>
        <div class="main-display" id="display">0</div>

        <div class="breakdown-box" id="breakdownBox">
            <div class="breakdown-row">
                <span class="label">Step 1 (Division):</span>
                <span class="val" id="step1Val">-</span>
            </div>
            <div class="breakdown-row">
                <span class="label">Step 2 (Multiply Back):</span>
                <span class="val-highlight" id="step2Val">-</span>
            </div>
            <div class="breakdown-row">
                <span class="label">Mathematical Error:</span>
                <span class="val" id="stepErr">0.000000%</span>
            </div>
        </div>
    </div>

    <div class="keypad">
        <button class="btn-clear" onclick="clearAll()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendOp('%')">%</button>
        <button class="btn-op" onclick="appendOp('/')">÷</button>

        <button onclick="appendNum('7')">7</button>
        <button onclick="appendNum('8')">8</button>
        <button onclick="appendNum('9')">9</button>
        <button class="btn-op" onclick="appendOp('*')">×</button>

        <button onclick="appendNum('4')">4</button>
        <button onclick="appendNum('5')">5</button>
        <button onclick="appendNum('6')">6</button>
        <button class="btn-op" onclick="appendOp('-')">-</button>

        <button onclick="appendNum('1')">1</button>
        <button onclick="appendNum('2')">2</button>
        <button onclick="appendNum('3')">3</button>
        <button class="btn-op" onclick="appendOp('+')">+</button>

        <button onclick="appendNum('0')">0</button>
        <button onclick="appendNum('.')">.</button>
        <button class="btn-op" onclick="calculateStandard()">=</button>

        <button class="btn-rev" onclick="executeReversePrecision()">
            ↺ Reverse Precision Division
        </button>
    </div>

    <div class="history-section">
        <div class="history-header">
            <span>Audit History</span>
            <span style="cursor:pointer;" onclick="clearHistory()">Clear</span>
        </div>
        <div class="history-list" id="historyList">
            <div style="color: var(--text-secondary); text-align: center; padding: 10px;">No calculations logged</div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
